spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# 로컬 실연동 시 GEMINI_ENABLED=true, GEMINI_API_KEY=... 환경변수 주입. 키는 커밋하지 않는다.
gemini:
  enabled: ${GEMINI_ENABLED:true}
  api-key: ${GEMINI_API_KEY:}

# 로컬에서 Gemini 응답 원문과 글자수를 확인하기 위한 로그.
logging:
  level:
    com.nexters.death.result.client: debug
