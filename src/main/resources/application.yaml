spring:
  application:
    name: death

app:
  cors:
    allowed-origins:
      - http://localhost:3000
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

gemini:
  enabled: ${GEMINI_ENABLED:false}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-flash-latest}
  timeout: ${GEMINI_TIMEOUT:30s}
